name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.p12

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "No unsigned APK found, listing directory:"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

          BUILD_TOOLS=$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)
          echo "Using build tools: $BUILD_TOOLS"

          ${ANDROID_HOME}/build-tools/$BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk

          ${ANDROID_HOME}/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks release-key.p12 \
            --ks-pass pass:opencode123 \
            --key-pass pass:opencode123 \
            --ks-key-alias opencode \
            --out "opencode-android-v${{ steps.version.outputs.name }}.apk" \
            aligned.apk

          echo "Signed APK created"
          ls -la "opencode-android-v${{ steps.version.outputs.name }}.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: "opencode-release-v${{ steps.version.outputs.name }}"
          path: "opencode-android-v${{ steps.version.outputs.name }}.apk"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: opencode-debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: "opencode-release-v${{ steps.version.outputs.name }}"

      - name: List downloaded files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.name }}"
          name: "v${{ steps.version.outputs.name }}"
          body: |
            ## OpenCode Android v${{ steps.version.outputs.name }}
            
            Native Android frontend for the OpenCode AI coding agent.
            
            ### APK Files
            - **`opencode-android-v${{ steps.version.outputs.name }}.apk`** - Signed release APK (recommended)
            - `app-debug.apk` - Debug APK
            
            ### Setup
            1. In Termux/Ubuntu, run: `opencode serve --hostname 0.0.0.0 --port 4096`
            2. Install the APK on your Android device
            3. Open the app - it auto-connects to `127.0.0.1:4096`
            4. If using a different host, configure in Settings
            
            ### Features
            - ChatGPT-like chat UI with streaming responses
            - Real-time tool/action progress
            - Session management (create, list, delete, abort)
            - File browser with search
            - Diff viewer for session changes
          files: |
            opencode-android-v${{ steps.version.outputs.name }}.apk
            app-debug.apk
          draft: false
          prerelease: false
